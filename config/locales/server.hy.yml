# frozen_string_literal: true

"hy":
  reply_to_view:
    reply:
      placeholder: "Այս բովանդակությունը թաքնված է մինչև պատասխանեք այս թեմայում"
      count_placeholder: "Այս բովանդակությունը տեսանելի կդառնա այս թեմայում առնվազն %{count} վավեր պատասխան հրապարակելուց հետո"
    login:
      placeholder: "Մուտք գործեք այս բովանդակությունը տեսնելու համար"
    sanitized_placeholder: "[թաքնված բովանդակություն]"
    search_placeholder: "[պաշտպանված բովանդակություն]"
    revision_placeholder: "Այս պաշտպանված գրառման բովանդակության փոփոխությունները թաքնված են"
  site_settings:
    enable_rtv: "Միացնում է reply-to-view պլագինը ([reply] և [login] բովանդակության պաշտպանության պիտակներ)։ Անջատված ժամանակ նախկինում նշված բովանդակությունը ցուցադրվում է որպես սովորական տեքստ։"
    reply_to_view_mode: "Ինչպես է բացվում [reply] բովանդակությունը։ any_reply՝ թեմայում ցանկացած վավեր պատասխան բացում է ամեն ինչ։ exact_post՝ միայն բովանդակություն պարունակող գրառմանը ուղղակի պատասխանն է այն բացում (առաջին գրառման համար հաշվվում է նաև թեմայում պատասխանը)։"
    reply_to_view_allow_count: "Միացնում է [reply=N] հաշվիչ շարահյուսությունը՝ բովանդակությունը տեսանելի է դառնում թեմայում առնվազն N վավեր պատասխանից հետո։ Անջատված ժամանակ [reply=N]-ը գործում է որպես սովորական [reply]։"
    min_trust_level_to_bypass: "Այս վստահության մակարդակի և բարձր օգտատերերը կարող են տեսնել բոլոր reply-to-view բովանդակությունը առանց պատասխանելու։ 0-ը անջատում է բացառությունը։"
    min_trust_level_to_use: "Ամենացածր վստահության մակարդակը թաքնված բովանդակության պիտակների օգտագործման համար։ Ավելի ցածր մակարդակի օգտատերերի պիտակները գործողություն չունեն, և նրանց բովանդակությունը տեսանելի է բոլորին։"
    keywords:
      enable_rtv: "rtv, պատասխանիր տեսնելու համար, թաքնված բովանդակություն, մուտք գործիր տեսնելու համար"
      reply_to_view_mode: "պատասխանների ռեժիմ, ցանկացած պատասխան, ճշգրիտ գրառում"
      reply_to_view_allow_count: "պատասխանների քանակ, reply=N"
      min_trust_level_to_bypass: "վստահության մակարդակ, բացառություն"
      min_trust_level_to_use: "վստահության մակարդակ, պիտակների օգտագործում"
