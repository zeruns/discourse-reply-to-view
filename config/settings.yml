# frozen_string_literal: true

# 站点设置项（安装后于 /admin/site_settings/category/plugins 中配置）
plugins:
  # 插件总开关
  # 关闭后:历史标记内容在渲染视图中以明文回显（无框直出）,开关可逆无数据丢失
  enable_rtv:
    default: true
    client: true

  # 回复可见模式
  #   any_reply —— 在本主题发布过任意有效回复即解锁全部 [reply] 内容（默认）
  #   exact_post —— 必须直接回复 [reply] 内容所在楼层才解锁该楼内容;
  #                 主楼兼容「直接回复主题」与「回复主楼」两种情况
  reply_to_view_mode:
    type: enum
    choices:
      - any_reply
      - exact_post
    default: any_reply
    client: true

  # 是否启用进阶计数语法 [reply=N]
  # 开启后 [reply=N] 要求用户在本主题下的有效回复总数 >= N;
  # 关闭时 [reply=N] 自动降级为普通 [reply] 逻辑
  reply_to_view_allow_count:
    default: false
    client: true

  # 信任等级豁免:TL >= 该值的用户无需回复即可见全部 [reply] 内容（仅对 reply 标记生效）
  # 0 = 不启用豁免。注意:默认值 1 意味着 TL1+ 用户免回复,
  # 若希望严格的“回帖可见”体验,建议设为 0 或更高
  min_trust_level_to_bypass:
    type: integer
    min: 0
    max: 4
    default: 1
    client: true

  # 使用权限:仅 TL >= 该值的用户可使用隐藏标记
  # 低于该等级的用户发布的标记不生效（内容对所有人直接可见）
  min_trust_level_to_use:
    type: integer
    min: 0
    max: 4
    default: 1
    client: true
